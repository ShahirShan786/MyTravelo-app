buildscript {
    ext.kotlin_version = '1.9.22'  // ✅ Match settings.gradle
    repositories {
        google()
        mavenCentral()
    }

    dependencies { 
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.android.tools.build:gradle:8.1.4'  // ✅ Match settings.gradle
        classpath 'com.google.gms:google-services:4.4.0'  // ✅ Updated
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}